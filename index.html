<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>バクテリア・レース 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#e9f1f4; --dim:#8fa5b0; --line:rgba(233,241,244,.14);
  --panel:rgba(6,16,26,.86); --gold:#d9b54a; --bg:#050d16;
  --hit:#ff7a6b; --mid:#f0c05a; --res:#6f828c;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);color-scheme:dark;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0 auto 0 0;width:min(680px,100%);background:linear-gradient(90deg,var(--panel) 84%,transparent);padding:24px 60px 24px 30px;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:15px}
.eyebrow{font-size:11px;letter-spacing:.28em;color:var(--gold)}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(26px,5vw,38px);line-height:1.15;letter-spacing:.02em}
.lead{color:var(--dim);font-size:13px;line-height:1.7;max-width:38em}
h2{font-size:11px;letter-spacing:.2em;color:var(--dim);font-weight:500;margin-bottom:7px;display:flex;gap:10px;align-items:center}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
h2 span{letter-spacing:0}
#species{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sp{text-align:left;padding:9px 11px 8px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025);transition:border-color .15s,background .15s}
.sp:hover{background:rgba(255,255,255,.06)}
.sp[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.sp .n{font-style:italic;font-weight:700;color:var(--c);font-size:14.5px;display:flex;justify-content:space-between;align-items:baseline}
.sp .n em{font-style:normal;font-weight:500;font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.sp .j{font-size:10.5px;color:var(--dim);margin:1px 0 6px}
.bar{display:grid;grid-template-columns:auto 1fr 30px;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);height:12px}
.bar i{display:block;height:4px;border-radius:2px;background:var(--c);min-width:2px}
.bar b{font-weight:500;text-align:right;color:var(--ink)}
.bar span{font-family:var(--serif);color:var(--gold)}
.chips{display:flex;gap:3px;margin-top:6px}
.chip{flex:1;font-size:9.5px;text-align:center;border-radius:4px;padding:1px 0;line-height:1.35;border:1px solid transparent}
.chip.e2{background:rgba(255,122,107,.2);color:var(--hit);border-color:rgba(255,122,107,.4)}
.chip.e1{background:rgba(240,192,90,.14);color:var(--mid)}
.chip.e0{color:var(--res);border-color:var(--line)}
.legend{font-size:10.5px;color:var(--dim);line-height:1.7;margin-top:7px}
.legend b{font-weight:500}
.legend .e2{color:var(--hit)}.legend .e1{color:var(--mid)}.legend .e0{color:var(--res)}
.row{display:grid;gap:7px}
#courses{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
#courses .co{text-align:left;padding:8px 10px}
#modes{grid-template-columns:1fr 1fr}
.co{padding:8px 6px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;line-height:1.35;background:rgba(255,255,255,.025)}
.co small{display:block;color:var(--dim);font-size:10.5px}
.co[aria-pressed=true]{border-color:var(--gold);background:rgba(217,181,74,.13)}
#lang{position:absolute;top:22px;right:60px;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:11.5px}
#lang button{padding:4px 12px;color:var(--dim)}
#lang button[aria-pressed=true]{background:var(--gold);color:#17120a;font-weight:700}
.src a{color:inherit}
@media (max-width:1000px){#lang{right:30px}}
@media (max-width:480px){#lang{right:14px;top:16px}}
#go{align-self:flex-start;padding:12px 34px;border-radius:999px;background:var(--gold);color:#17120a;font-weight:700;font-size:16px;letter-spacing:.08em}
#go:hover{filter:brightness(1.1)}
.keys{font-size:11.5px;color:var(--dim);line-height:1.8}
kbd{font:inherit;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink)}
.src{font-size:10.5px;color:#627681;line-height:1.6}
#blurb{position:fixed;right:32px;bottom:28px;width:min(360px,32vw);text-align:right;pointer-events:none}
#blurb .n{font-family:var(--serif);font-style:italic;font-size:26px}
#blurb p{font-size:12.5px;color:var(--dim);line-height:1.7;margin-top:4px}
@media (max-width:1000px){#blurb{display:none}#menu{background:var(--panel);padding-right:30px}}
@media (max-width:480px){#menu{padding:18px 14px}#courses{grid-template-columns:1fr 1fr}}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>div{position:absolute}
#rank{left:20px;top:14px}
#rank .big{font-family:var(--serif);font-size:54px;line-height:1;font-weight:700}
#rank .big small{font-size:18px;color:var(--dim);font-weight:500}
#rank .who{font-style:italic;font-weight:700;margin-top:2px}
#stat{right:20px;top:14px;text-align:right}
#stat .t{font-family:var(--serif);font-size:34px;line-height:1;color:var(--gold)}
#stat .t small{font-size:14px}
#stat .v{font-size:20px;font-weight:700;margin-top:6px}
#stat .v small{font-size:11px;color:var(--dim);font-weight:400}
#stat .slow{font-size:10.5px;color:var(--dim);margin-top:2px}
#env{left:50%;top:14px;transform:translateX(-50%);text-align:center;white-space:nowrap}
#env .k{font-family:var(--serif);color:var(--gold);font-size:13px;letter-spacing:.2em}
#env .nm{font-family:var(--serif);font-size:22px;font-weight:700}
#env .my{font-size:12px;margin-top:2px;color:var(--dim)}
#env .my b{color:var(--ink)}
#env.flash{animation:flash .9s ease-out}
@keyframes flash{0%{transform:translateX(-50%) scale(1.35);opacity:0}30%{opacity:1}100%{transform:translateX(-50%) scale(1)}}
#center{left:50%;top:42%;transform:translate(-50%,-50%);font-family:var(--serif);font-size:120px;font-weight:700;text-shadow:0 0 40px rgba(0,0,0,.6)}
#msg{left:50%;top:25%;transform:translateX(-50%);font-size:14px;font-weight:700;padding:6px 16px;border-radius:999px;background:rgba(0,0,0,.55);max-width:92vw;text-align:center;opacity:0;transition:opacity .2s}
#msg.on{opacity:1}
#item{left:20px;bottom:62px;width:min(300px,62vw);border:1px solid var(--line);border-radius:12px;background:rgba(4,10,18,.6);padding:9px 12px 10px}
#item .lab{font-size:10px;letter-spacing:.18em;color:var(--dim);display:flex;justify-content:space-between}
#item .nm{font-weight:700;font-size:17px;margin-top:2px}
#item .sb{font-size:11px;color:var(--dim);min-height:15px}
#item .cmp{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
#item .cmp span{font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:4px;border:1px solid var(--line);font-style:italic}
#item .cmp span.e0{opacity:.4;text-decoration:line-through}
#item .cmp span.e2{background:rgba(255,255,255,.12)}
#item.empty .nm{color:var(--dim);font-weight:400;font-size:14px}
#wrap{left:20px;bottom:176px;font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(4,10,18,.6);color:var(--dim)}
#wrap b{color:var(--ink);margin-right:8px}
#wrap.on{border-color:#fff;background:rgba(255,255,255,.16)}
#wrap.on b{color:#fff}
#wrap.warn{border-color:var(--gold);color:var(--gold)}
#prog{left:20px;right:20px;bottom:22px;height:30px}
#prog .secs{position:absolute;inset:5px 0 auto 0;height:20px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.07)}
#prog .secs i{display:block;position:absolute;border-radius:1px}
#prog .lbls{position:absolute;inset:auto 0 -6px 0;display:flex;gap:12px;font-size:9.5px;letter-spacing:.06em}
#prog .lbls span{white-space:nowrap}
.dot{position:absolute;top:9px;width:12px;height:12px;border-radius:50%;margin-left:-6px;border:2px solid #050d16}
.dot.me{width:18px;height:18px;top:6px;margin-left:-9px;border-color:#fff;z-index:2}
#touch{inset:auto 0 150px 0;display:none;justify-content:space-between;padding:0 14px;pointer-events:none}
#touch button{pointer-events:auto;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid var(--line);font-size:22px}
#touch .b{width:auto;padding:0 24px;border-radius:34px;font-size:14px;font-weight:700;letter-spacing:.1em;background:rgba(217,181,74,.25)}
@media (pointer:coarse){#touch{display:flex}}
#quit{position:fixed;right:20px;top:108px;pointer-events:auto;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 12px}

/* ---------- result ---------- */
#result{position:fixed;inset:0;display:grid;place-items:center;background:rgba(3,8,14,.6);padding:16px;overflow-y:auto;touch-action:pan-y}
#result .card{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 26px 22px}
#result h3{font-family:var(--serif);font-size:30px;font-weight:700;margin:4px 0 2px}
#result .sum{color:var(--dim);font-size:13px;line-height:1.7;margin-bottom:12px}
#result table{width:100%;border-collapse:collapse;font-size:13.5px}
#result td{padding:6px 4px;border-top:1px solid var(--line)}
#result td:first-child{font-family:var(--serif);font-size:17px;width:30px;color:var(--dim)}
#result td:last-child,#result td.h{text-align:right}
#result td.h{font-size:11px;color:var(--dim)}
#result tr.me td{background:rgba(255,255,255,.07)}
#result tr.me td:first-child{color:var(--gold)}
#result .nm{font-style:italic;font-weight:700}
#result .you{font-size:10px;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;font-style:normal}
#result .btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
#result .btns button{padding:10px 22px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:14px}
#result .btns .p{background:var(--gold);color:#17120a;border-color:var(--gold)}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--dim);line-height:1.8}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="menu">
  <div>
    <div class="eyebrow">8 SPECIES · 5 COURSES · ITEM BATTLE</div>
    <div id="lang"><button data-l="ja">日本語</button><button data-l="en">English</button></div>
    <h1 id="t_title"></h1>
  </div>
  <p class="lead" id="t_lead"></p>
  <div>
    <h2 id="t_hsp"></h2>
    <div id="species"></div>
    <p class="legend" id="legend"></p>
  </div>
  <div><h2 id="t_hco"></h2><div id="courses" class="row"></div></div>
  <div><h2 id="t_hmo"></h2><div id="modes" class="row"></div></div>
  <button id="go"></button>
  <p class="keys" id="t_keys"></p>
  <p class="src" id="t_src"></p>
</div>
<div id="blurb"><div class="n" id="bn"></div><p id="bd"></p></div>

<div id="hud" class="hidden">
  <div id="rank"><div class="big num"><span id="rk">1</span><small id="t_of"></small></div><div class="who" id="who"></div></div>
  <div id="env"><div class="k" id="ek"></div><div class="nm" id="en"></div><div class="my num" id="em"></div></div>
  <div id="stat"><div class="t num"><span id="tm">0.00</span><small> s</small></div><div class="v num"><span id="sv">0.0</span> <small>µm/s</small></div><div class="slow" id="t_slow"></div></div>
  <div id="center"></div>
  <div id="msg"></div>
  <div id="wrap" class="hidden"><b id="wk"></b><span id="wh"></span></div>
  <div id="item" class="empty"><div class="lab"><span id="t_il"></span><span id="ih"></span></div><div class="nm" id="in"></div><div class="sb" id="is"></div><div class="cmp" id="ic"></div></div>
  <div id="prog"><div class="secs" id="psecs"></div><div class="lbls" id="plbls"></div><div id="pdots"></div></div>
  <div id="touch"><button data-k="left" aria-label="左">◀</button><span style="display:flex;gap:8px"><button class="b" id="tw" data-k="wrap"></button><button class="b" id="tu" data-k="use"></button></span><button data-k="right" aria-label="右">▶</button></div>
  <button id="quit"></button>
</div>

<div id="result" class="hidden"><div class="card">
  <div class="eyebrow" id="rc"></div>
  <h3 id="rh"></h3>
  <p class="sum" id="rs"></p>
  <table id="rt"></table>
  <div class="btns"><button class="p" id="again"></button><button id="back"></button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(typeof THREE==='undefined'){
  document.body.insertAdjacentHTML('beforeend','<div id="err">3Dライブラリ（three.js）を読み込めませんでした。ネットワーク接続を確認して再読み込みしてください。<br>Could not load the 3D library (three.js). Check your connection and reload.</div>');
  $('menu').classList.add('hidden');return;
}

/* ================= data ================= */
// v: mean speed (µm/s) in no-MC open / 0.4% MC open / 1.25-µm channel, from the movie.
// s: susceptibility to [β-lactam, glycopeptide, polymyxin, aminoglycoside, macrolide]; 2 = works well, 1 = partly, 0 = resistant (game simplification).
const SPECIES=[
 {id:'cj',ab:'Cj',name:'C. jejuni',jp:'カンピロバクター・ジェジュニ',gram:'−',color:0x19c98a,v:[29.8,46.5,46.1],s:[0,0,0,2,2],shape:'spiral',wrap:true,wrapIn:1.12,noGlu:true,
  desc:'らせん形の体と両端のべん毛。粘性にも狭さにも強い。前方のべん毛を菌体に巻きつけるラッピングモードで狭小ルートがさらに伸びる。ただしグルコキナーゼを欠くため、道に落ちているグルコースでは加速できない。代わりに加速アイテムがピルビン酸になり、グルコースより強い。マクロライドとアミノグリコシドが弱点。'},
 {id:'ci',ab:'Ci',name:'C. insecticola',jp:'カバレロニア・インセクティコラ',gram:'−',color:0x3fae5a,v:[22.4,18.3,2.6],s:[0,0,0,2,0],shape:'tuft',nf:3,len:2.4,rad:.4,wrap:true,
  desc:'極べん毛の束で泳ぐ桿菌。べん毛を菌体に巻きつけるラッピングモードで狭小ルートを押し通れる。弱点はアミノグリコシドだけ。'},
 {id:'ba',ab:'Ba',name:'B. anthina',jp:'バークホルデリア・アンシナ',gram:'−',color:0x9aa3aa,v:[12.5,8.9,1.0],s:[0,0,0,0,0],shape:'tuft',nf:3,len:2.6,rad:.42,
  desc:'どの環境でも遅め。しかしセパシア群らしい多剤耐性で抗生物質5系統がすべて効かない。粘性なしの道を選んで堅実に。'},
 {id:'se',ab:'Se',name:'S. enterica',jp:'サルモネラ・エンテリカ',gram:'−',color:0xc42a45,v:[29.7,35.3,6.7],s:[2,0,2,2,0],shape:'bundle',len:2.8,rad:.42,nf:6,
  desc:'菌体の側面から生える周べん毛を束ねて泳ぐ安定型。粘性の近道は得、狭小ルートは損。βラクタム・ポリミキシン・アミノグリコシドがよく効く。'},
 {id:'vf',ab:'Vf',name:'V. fischeri',jp:'ビブリオ・フィシェリ',gram:'−',color:0x3cc4b3,v:[36.0,51.0,15.9],s:[1,0,1,2,1],shape:'tuft',nf:3,len:3.2,rad:.4,wrap:true,chiStick:true,
  desc:'極に房状のべん毛を持つ万能型。粘性に強く、ラッピングモードで狭小ルートでも加速できる。ただし GlcNAc 結合タンパク質でキチン表面に吸着するため、白いキチンの区画では減速する。'},
 {id:'va',ab:'Va',name:'V. alginolyticus',jp:'ビブリオ・アルジノリティカス',gram:'−',color:0xc9cfd3,v:[44.5,16.2,3.8],s:[0,0,1,2,1],shape:'polar',len:1.8,rad:.5,chiStick:true,
  desc:'粘性なしの道では王者。粘性の近道や狭小ルートに入ると失速するので、遠回りでも広い道を。キチン表面には吸着して減速するので、白い区画も避けたい。'},
 {id:'fj',ab:'Fj',name:'F. johnsoniae',jp:'フラボバクテリウム・ジョンソニエ',gram:'−',color:0xe0b520,v:[1.7,1.7,1.4],s:[0,0,1,0,2],shape:'glide',len:6,rad:.24,chitin:true,
  desc:'べん毛を持たず、細胞表面の接着因子 SprB が左巻きのらせん状閉ループ上を流れることで滑走する細長い菌。体を回しながら進む。不溶性のキチンに直接触れて削り取れるので、白いキチンの区画では加速する。環境でほぼ速さが変わらないので、近道は常に得。マクロライドが弱点。'},
 {id:'bs',ab:'Bs',name:'B. subtilis',jp:'枯草菌（バチルス・サブチリス）',gram:'＋',color:0xe5584d,v:[27.6,57.4,33.1],s:[2,2,0,2,2],shape:'bundle',len:4.2,rad:.42,nf:24,
  desc:'菌体の側面から生える20〜30本の周べん毛を持ち、粘性の中で全体最速。粘性ゾーンと近道が稼ぎどころ。唯一のグラム陽性菌で、バンコマイシンを含むほとんどの薬が直撃する。'}
];
const ABX=[
 {k:'β',cls:'βラクタム系',drug:'アンピシリン',mech:'細胞壁（ペプチドグリカン）合成を阻害',col:0xff8a5c},
 {k:'V',cls:'グリコペプチド系',drug:'バンコマイシン',mech:'細胞壁合成を阻害。大きすぎて外膜を通れない',col:0xd98cff},
 {k:'P',cls:'ポリミキシン系',drug:'コリスチン',mech:'外膜のLPSに結合して膜を壊す',col:0x6fd0ff},
 {k:'A',cls:'アミノグリコシド系',drug:'ゲンタマイシン',mech:'リボソーム30Sに結合しタンパク質合成を乱す',col:0xffe066},
 {k:'M',cls:'マクロライド系',drug:'エリスロマイシン',mech:'リボソーム50Sに結合しタンパク質合成を止める',col:0x8dffb0}
];
const EFF=['耐性','やや効く','よく効く'];
const ENVN=['粘性なし','粘性あり','狭小'];
const ENVC=['#7fa8d8','#58b9c9','#c9a56a'];
// Course features in (distance, lateral) space. Road is 13 µm wide (lateral −6.5 … 6.5).
// v: viscous patch · c: narrow-channel block · h: hole · o: rail-less edge (side −1 / +1 / 0 = both) · s: viscous shortcut on that side
const COURSES=[
 {id:'chip',name:'マイクロ流体サーキット',sub:'ガラスのチップ。分岐を覚える入門コース',sw:'#3a9bd9',wave:[6,44,2,17],len:720,
  th:{bg:0x06131f,fog:.013,floor:0x0c2a45,rail:0x3a9bd9,vis:0x16606e,visLine:0x9fe8f2,wall:0x8fb7c9,chFloor:0x1d3344,part:0x9fd0ff,under:0x02060b,deco:'pillar'},
  feats:[['v',70,115,-6.5,6.5],['c',150,190,-6.5,0],['v',150,190,.5,6.5],['s',225,285,1],['o',320,385,-1],['h',345,357,-1.5,2],

function capsule(len,rad,mat){
  const g=new THREE.Group();
  const c=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,Math.max(.01,len-2*rad),18,1,true),mat);c.rotation.x=Math.PI/2;g.add(c);
  for(const s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(rad,18,12),mat);e.position.z=s*(len/2-rad);g.add(e);}
  return g;
}
function helix(len,R,turns,thick,mat,phase,cap,hand){
  const pts=[],n=Math.max(24,Math.round(turns*16));
  for(let i=0;i<=n;i++){const t=i/n,a=(phase||0)+(hand||1)*t*turns*Math.PI*2,r=R*Math.min(1,t*5);
    pts.push(new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r,t*len));}
  const tube=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),n*2,thick,cap?10:5,false),mat);
  if(!cap)return tube;
  const g=new THREE.Group();g.add(tube);
  const cg=new THREE.SphereGeometry(thick,14,10);
  for(const p of[pts[0],pts[pts.length-1]]){const e=new THREE.Mesh(cg,mat);e.position.copy(p);g.add(e);}
  return g;
}
// A flagellar filament whose helical wave is recomputed every frame, so it visibly rotates along its whole
// length: rooted on the cell surface at (z0, angle a), running back beside the body, then converging over
// ~2.6 µm onto the cell axis, where all filaments share one helix (the bundle).
function waveFilament(L,R,z0,a,len,delta,mat){
  const N=52,pos=new Float32Array(N*4*3),idx=[];
  for(let i=0;i<N-1;i++)for(let j=0;j<4;j++){const p=i*4+j,q=i*4+(j+1)%4;idx.push(p,q,p+4,q,q+4,p+4);}
  const g=new THREE.BufferGeometry(),at=new THREE.BufferAttribute(pos,3);g.setAttribute('position',at);g.setIndex(idx);
  const m=new THREE.Mesh(g,mat);m.frustumCulled=false;
  const ss=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);},zr=L/2,s1=zr+len,ca=Math.cos(a),sa=Math.sin(a),T=.024,K=2*Math.PI/1.4;
  const upd=th=>{
    for(let i=0;i<N;i++){const s=z0+(s1-z0)*i/(N-1);
      const rho=lerp(lerp(R,R+.16,ss((s-z0)/.35)),0,ss((s-(zr-.4))/2.6));
      const A=.16*ss((s-z0)/.6)+.05*ss((s-zr)/2),ph=K*s+delta-th,x=rho*ca+A*Math.cos(ph),y=rho*sa+A*Math.sin(ph);
      for(let j=0;j<4;j++){const o=(i*4+j)*3,t=j*Math.PI/2;pos[o]=x+T*Math.cos(t);pos[o+1]=y+T*Math.sin(t);pos[o+2]=s;}}
    at.needsUpdate=true;};
  upd(0);return {m,upd};
}
const shieldGeo=new THREE.SphereGeometry(1,16,12);
function buildBacterium(sp){
  const g=new THREE.Group(),spin=[],waves=[];
  const col=new THREE.Color(sp.color);
  const body=new THREE.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(.35),roughness:.45,metalness:.05});
  const fl=new THREE.MeshBasicMaterial({color:col.clone().lerp(new THREE.Color(0xffffff),.45),transparent:true,opacity:.85});
  let wrap=[],sprb=null,rollK=0,L=sp.len||2.6;
  if(sp.shape==='spiral'){
    // Cohen et al. 2020: the cell body is a right-handed helix and the filament a left-handed one,
    // and their helical angles are about the same (~40 deg). PITCH gives 40 deg at amplitude AMP.
    const AMP=.17,PITCH=2*Math.PI*AMP/Math.tan(40*Math.PI/180),BL=1.7,RL=2.6,FL=2.2;
    const b=helix(BL,AMP,BL/PITCH,.19,body,0,true,1);b.position.z=-BL/2;g.add(b);spin.push({o:b,k:.5});
    const r=helix(RL,AMP,RL/PITCH,.032,fl,0,false,-1);r.position.z=BL/2-.03;g.add(r);spin.push({o:r,k:1});
    const f=helix(FL,AMP,FL/PITCH,.032,fl,0,false,-1);f.rotation.y=Math.PI;f.position.z=-BL/2+.03;g.add(f);spin.push({o:f,k:-1});if(sp.wrap)wrap.push(f);
  }else{
    const R=sp.rad;g.add(capsule(L,R,body));
    if(sp.shape==='polar'){
      const f=helix(4.2,.26,3,.035,fl);f.position.z=L/2-.05;g.add(f);spin.push({o:f,k:1});
      if(sp.wrap)wrap.push(f);
    }else if(sp.shape==='tuft'){ // polar bundle / tuft: filaments share one helix behind the pole
      for(let i=0;i<sp.nf;i++){const f=helix(3.8,.21+i*.015,2.7,.03,fl,i*.3);f.position.z=L/2-.05;g.add(f);spin.push({o:f,k:1});if(sp.wrap)wrap.push(f);}
    }else if(sp.shape==='bundle'){ // peritrichous: each filament is a rotating helix from its root at mid-body, merging gradually into one bundle behind the cell
      const flw=fl.clone();flw.side=THREE.DoubleSide;
      for(let i=0;i<sp.nf;i++){
        const w=waveFilament(L,R,L*(-.3+.6*((i*.618)%1)),i*2.399,4.2+((i*37)%10)*.05,(((i*.618)%1)-.5)*.7,flw);
        g.add(w.m);waves.push(w);}
    }else if(sp.shape==='glide'){
      // SprB adhesins ride a closed left-handed helical loop on the cell surface.
      // TURN = 2*PI per leg closes the loop and sets the pitch angle to ~18 deg from
      // the long axis, matching the 17.6 +- 6.7 / 19.0 +- 11.5 deg reported.
      const h=L/2-R,TURN=2*Math.PI,rr=R+.05;
      rollK=TURN/(2*h);                       // radians of cell roll per um travelled
      const track=u=>{const f=u<.5,w=f?u*2:(u-.5)*2,z=f?-h+2*h*w:h-2*h*w,th=-(f?TURN*w:TURN+TURN*w);
        return[Math.cos(th)*rr,Math.sin(th)*rr,z,th];};
      const lp=[];for(let i=0;i<=200;i++){const p=track((i%200)/200);lp.push(p[0],p[1],p[2]);}
      const tg=new THREE.BufferGeometry();tg.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));
      g.add(new THREE.Line(tg,new THREE.LineBasicMaterial({color:0xfff3c8,transparent:true,opacity:.5})));
      const dm=new THREE.MeshBasicMaterial({color:0xfff6cc});
      const kg=new THREE.SphereGeometry(.065,8,6);
      const sg=new THREE.CylinderGeometry(.016,.016,.15,5);sg.rotateZ(Math.PI/2);sg.translate(.075,0,0);
      sprb={track,h,list:[],u:0};
      for(let i=0;i<9;i++){const d=new THREE.Group();d.add(new THREE.Mesh(kg,dm));d.add(new THREE.Mesh(sg,dm));
        g.add(d);sprb.list.push({d,u0:i/9});}
    }
  }
  const sh=new THREE.Mesh(shieldGeo,new THREE.MeshBasicMaterial({color:0x9dffd9,transparent:true,opacity:.22,depthWrite:false}));
  sh.scale.set(1.1,1.1,L/2+1);sh.visible=false;g.add(sh);
  return {g,spin,waves,th:0,sprb,rollK,wrap:wrap.length?wrap:null,sp,body,base:col.clone().multiplyScalar(.35),shield:sh};
}
function updSprB(m,v,dt){
  const S=m.sprb,ve=sprbV(v);S.u=(S.u+ve*dt*TS/(4*S.h))%1;
  for(const o of S.list){const p=S.track((S.u+o.u0)%1);o.d.position.set(p[0],p[1],p[2]);o.d.rotation.z=p[3];}
}

function cx(d){
  let x=WV[0]*Math.sin(d/WV[1])+WV[2]*Math.sin(d/WV[3]+1);
  for(const s of SCS)if(d>s.a&&d<s.b){const q=Math.sin(Math.PI*(d-s.a)/(s.b-s.a));x-=s.side*BUMP*q*q;}
  return x;
}
const dcx=d=>(cx(d+.5)-cx(d-.5));
const chAt=(d,pre)=>{for(const f of CHS)if(d>=f.a-(pre||0)&&d<f.b)return f;return null;};
function envAt(d,lat){
  const c=chAt(d);if(c&&lat>=c.l0&&lat<=c.l1)return 2;
  for(const f of VIS)if(d>=f.a&&d<f.b&&lat>=f.l0&&lat<=f.l1)return 1;
  return 0;
}
const holeAt=(d,lat,m)=>{m=m||0;for(const h of HOLES)if(d>=h.a-m&&d<h.b+m&&lat>h.l0-m&&lat<h.l1+m)return h;return null;};

const nearest=(arr,l)=>arr.reduce((a,c)=>Math.abs(c-l)<Math.abs(a-l)?c:a,arr[0]);

function setupCourse(c){
  course=c;TH=c.th;LEN=c.len;WV=c.wave;
  F=[];VIS=[];CHS=[];HOLES=[];OPEN=[];SCS=[];CHI=[];
  for(const f of c.feats)if(f[0]==='s')SCS.push({t:'s',a:f[1],b:f[2],side:f[3]});
  for(const s of SCS){ // cx already includes the bumps (zero at both ends)
    const xE=cx(s.a)+s.side*(HW-1.2),xX=cx(s.b)+s.side*(HW-1.2);
    s.xs=d=>xE+(xX-xE)*(d-s.a)/(s.b-s.a);s.slope=(xX-xE)/(s.b-s.a);
    s.rel=d=>s.side*(s.xs(d)-cx(d));
    let main=0;for(let d=s.a;d<s.b;d+=.5)main+=Math.hypot(.5,cx(d+.5)-cx(d));
    s.gain=main/Math.hypot(s.b-s.a,xX-xE);
    s.split=d=>s.rel(d)-SW>HW+.6;
    F.push(s);
  }
  for(const f of c.feats){
    const[t,a,b,p,q]=f;
    if(t==='v'){const o={t,a,b,l0:p,l1:q};VIS.push(o);F.push(o);}
    else if(t==='h'){const o={t,a,b,l0:p,l1:q};HOLES.push(o);F.push(o);}
    else if(t==='o'){const o={t,a,b,side:p};OPEN.push(o);F.push(o);}
    else if(t==='c'){const n=Math.max(1,Math.round((q-p)/2.6)),pitch=(q-p)/n,cs=[];for(let i=0;i<n;i++)cs.push(p+pitch*(i+.5));
      const o={t,a,b,l0:p,l1:q,cs,full:p<=-HW+.1&&q>=HW-.1};CHS.push(o);F.push(o);}
  }
}

// strip between two polylines given as [x,y,z] arrays
function strip(A,B,mat){
  const pos=[],idx=[];
  for(let i=0;i<A.length;i++){pos.push(A[i][0],A[i][1],A[i][2],B[i][0],B[i][1],B[i][2]);
    if(i){const k=i*2;idx.push(k-2,k-1,k,k-1,k+1,k);}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  return new THREE.Mesh(g,mat);
}
const XL=l=>d=>cx(d)+l; // world x of a constant-lateral line on the main road
function pl(xf,y,a,b){const r=[];const n=Math.max(1,Math.ceil((b-a)/1.5));for(let i=0;i<=n;i++){const d=a+(b-a)*i/n;r.push([xf(d),y,-d]);}return r;}

function wallBlock(x0,x1,y0,y1,a,b,mat,grp){
  grp.add(ribbon(x0,x1,y1,a,b,mat));
  grp.add(strip(pl(x0,y0,a,b),pl(x0,y1,a,b),mat));
  grp.add(strip(pl(x1,y0,a,b),pl(x1,y1,a,b),mat));
  for(const d of[a,b])grp.add(strip([[x0(d),y0,-d],[x0(d),y1,-d]],[[x1(d),y0,-d],[x1(d),y1,-d]],mat));
}

  const under=new THREE.Mesh(new THREE.PlaneGeometry(600,LEN+300),new THREE.MeshBasicMaterial({color:TH.under}));
  under.rotation.x=-Math.PI/2;under.position.set(0,-5,-LEN/2);G.add(under);
  const basic=(col,o)=>new THREE.MeshBasicMaterial(Object.assign({color:col,side:DS},o||{}));
  const std=(col,o)=>new THREE.MeshStandardMaterial(Object.assign({color:col,roughness:.85,side:DS},o||{}));
  const floorM=std(TH.floor),visM=std(TH.vis),chM=std(TH.chFloor),wallM=std(TH.wall,{roughness:.8}),railM=basic(new THREE.Color(TH.rail).multiplyScalar(.75)),
    holeM=basic(TH.under),warnM=basic(0xffc530),hazM=basic(0xff5a3c);
  G.add(ribbon(XL(-HW),XL(HW),FLOOR,A0,B0,floorM));
  // rails: skipped along rail-less edges and where a shortcut peels off
  for(const side of[-1,1]){
    const ok=d=>!openAt(d,side)&&!SCS.some(s=>s.side===side&&d>s.a-1&&d<s.b+1&&!s.split(d));
    for(const[a,b]of runs(A0,B0,ok))wallBlock(XL(side>0?HW:-HW-.45),XL(side>0?HW+.45:-HW),FLOOR,FLOOR+.55,a,b,railM,G);
    for(const[a,b]of runs(A0,B0,d=>openAt(d,side)))G.add(ribbon(XL(side*(HW-.35)),XL(side*HW),FLOOR+.03,a,b,warnM));
  }
  const tp=[];for(let d=0;d<=LEN;d+=10){tp.push(cx(d)-HW,FLOOR+.02,-d,cx(d)+HW,FLOOR+.02,-d);}
  G.add(lines(tp,0xffffff,.08));
  const pp=[];for(let i=0;i<LEN*6;i++){const d=-20+R()*(LEN+50);pp.push(cx(d)+(R()-.5)*56,FLOOR+R()*8-1,-d);}
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.Float32BufferAttribute(pp,3));
  G.add(new THREE.Points(pg,new THREE.PointsMaterial({color:TH.part,size:.1,transparent:true,opacity:.6})));
  const threads=(xf0,xf1,a,b,dens)=>{const lp=[];
    for(let i=0;i<(b-a)*dens;i++){const d=a+R()*(b-a),x=lerp(xf0(d),xf1(d),R()),y=FLOOR+R()*5,L2=1+R()*3.5,th=R()*6.28,ph=(R()-.5)*2;
      lp.push(x,y,-d,x+Math.cos(th)*Math.cos(ph)*L2,y+Math.sin(ph)*L2,-d+Math.sin(th)*Math.cos(ph)*L2);}
    G.add(lines(lp,TH.visLine,.24));};

  for(const f of VIS){G.add(ribbon(XL(f.l0),XL(f.l1),FLOOR+.012,f.a,f.b,visM));threads(XL(f.l0),XL(f.l1),f.a,f.b,(f.l1-f.l0)*1.3);}
  for(const f of CHS){
    G.add(ribbon(XL(f.l0),XL(f.l1),FLOOR+.016,f.a,f.b,chM));
    const edges=[f.l0].concat(...f.cs.map(c=>[c-CHW,c+CHW]),[f.l1]);
    for(let i=0;i<edges.length;i+=2)if(edges[i+1]-edges[i]>.05)wallBlock(XL(edges[i]),XL(edges[i+1]),FLOOR,FLOOR+1.5,f.a,f.b,wallM,G);
  }
  for(const h of HOLES){
    G.add(ribbon(XL(h.l0),XL(h.l1),FLOOR+.02,h.a,h.b,holeM));
    const y=FLOOR+.03,e=.18;
    G.add(ribbon(XL(h.l0),XL(h.l1),y,h.a-e,h.a,hazM));G.add(ribbon(XL(h.l0),XL(h.l1),y,h.b,h.b+e,hazM));
    if(h.l0>-HW+.1)G.add(ribbon(XL(h.l0-e),XL(h.l0),y,h.a,h.b,hazM));
    if(h.l1<HW-.1)G.add(ribbon(XL(h.l1),XL(h.l1+e),y,h.a,h.b,hazM));
  }
  for(const s of SCS){
    const xi=d=>s.xs(d)-s.side*SW,xo=d=>s.xs(d)+s.side*SW;
    G.add(ribbon(xi,xo,FLOOR+.014,s.a,s.b,visM));threads(xi,xo,s.a,s.b,3.6);
    wallBlock(d=>xo(d),d=>xo(d)+s.side*.45,FLOOR,FLOOR+.55,s.a,s.b,railM,G);
    for(const[a,b]of runs(s.a,s.b,d=>s.split(d)))wallBlock(d=>xi(d)-s.side*.45,d=>xi(d),FLOOR,FLOOR+.55,a,b,railM,G);
    const sg=label(t('scSign',s.gain.toFixed(2)),'#ffd76a',1.5,false);sg.position.set(s.xs(s.a+6),3.2,-(s.a+6));G.add(sg);
  }
  for(const o of OPEN){const sg=label(t('noRail'),'#ffc530',1.3,false);sg.position.set(cx(o.a),4.4,-o.a);G.add(sg);}
  // Chitin patches. F. johnsoniae digests insoluble chitin by direct contact, so the
  // boost builds while the cell stays on the patch instead of arriving all at once.
  const chiM=std(0xc6d6d0),chiFM=basic(0xeaf4ef,{transparent:true,opacity:.8}),flakeGeo=new THREE.CircleGeometry(.24,5);
  for(let d=34,lastK=-999,n=0;d<LEN-34&&n<5;d+=4){
    if(d-lastK<78)continue;
    const a=d;let b=0,ok=false;
    for(const len of[30,20,14]){b=a+len;ok=true;
      for(let z=a-2;z<=b+2;z+=2)if(chAt(z,2)||SCS.some(x=>z>x.a-6&&z<x.b+6)){ok=false;break;}
      if(ok)break;}
    if(!ok)continue;
    // prefer a strip down the middle; if a hole blocks it, take whichever side is clear
    const cand=[[-2.4,2.4],[.7,EDGE],[-EDGE,-.7]].find(([p,q])=>!HOLES.some(h=>h.b>a&&h.a<b&&h.l1>p&&h.l0<q));
    if(!cand)continue;
    const l0=cand[0],l1=cand[1];
    lastK=b;n++;
    const o={t:'k',a,b,l0,l1};CHI.push(o);F.push(o);
    G.add(ribbon(XL(l0),XL(l1),FLOOR+.018,a,b,chiM));
    for(let i=0;i<(b-a)*1.1;i++){const z=a+.5+R()*(b-a-1),x=lerp(l0+.2,l1-.2,R());
      const fk=new THREE.Mesh(flakeGeo,chiFM);fk.position.set(cx(z)+x,FLOOR+.045,-z);
      fk.rotation.set(-Math.PI/2+(R()-.5)*.25,0,R()*6.28);fk.scale.setScalar(.55+R()*.85);G.add(fk);}
    const kg=label(t('chiSign'),'#eaf4ef',1.7,false);kg.position.set(cx(a+5)+(l0+l1)/2,3.1,-(a+5));G.add(kg);
  }
  buildDeco(G,R);

  // pickups
  const addPick=(type,d,lat,br)=>{
    const m=new THREE.Mesh(type==='box'?boxGeo:gluGeo,type==='box'?boxMat:gluMat);
    m.position.set(br?br.xs(d)+lat:cx(d)+lat,type==='box'?.15:0,-d);G.add(m);pick.push({type,d,lat,br:br||null,m,cd:0});
  };
  const place=(d,l)=>{ // returns a usable lateral near l at distance d, or null
    if(holeAt(d,l,.9))return null;
    const c=chAt(d,6);if(c){if(l>=c.l0&&l<=c.l1)return nearest(c.cs,l);if(l>c.l0-1.2&&l<c.l0)return c.l0-1.4>=-EDGE?c.l0-1.4:null;if(l<c.l1+1.2&&l>c.l1)return c.l1+1.4<=EDGE?c.l1+1.4:null;}
    return l;
  };
  for(let d=40;d<LEN-18;d+=58){
    const lats=[...new Set([-4.5,-1.5,1.5,4.5].map(l=>place(d,l)).filter(l=>l!=null))];
    if(lats.length){boxRows.push({d,lats});for(const l of lats)addPick('box',d,l);}
  }
  for(let d=12;d<LEN-4;d+=8+R()*8){
    if(boxRows.some(r=>Math.abs(r.d-d)<4))continue;
    const l=place(d,(R()-.5)*2*(EDGE-.8));if(l!=null)addPick('glu',d,l);
  }
  for(const s of SCS)addPick('glu',(s.a+s.b)/2,0,s);
  // finish
  const cv=document.createElement('canvas');cv.width=256;cv.height=16;const c2=cv.getContext('2d');
  for(let i=0;i<32;i++)for(let j=0;j<2;j++){c2.fillStyle=(i+j)%2?'#f4f4f4':'#111';c2.fillRect(i*8,j*8,8,8);}
  const ft=new THREE.CanvasTexture(cv);ft.magFilter=THREE.NearestFilter;
  const fin=new THREE.Mesh(new THREE.PlaneGeometry(HW*2,2),new THREE.MeshBasicMaterial({map:ft}));
  fin.rotation.x=-Math.PI/2;fin.position.set(cx(LEN+1),FLOOR+.04,-LEN-1);G.add(fin);
  const fl=label('GOAL','#ffffff',2.6,false);fl.position.set(cx(LEN),5.6,-LEN);G.add(fl);
}

function say(t,dur){$('msg').innerHTML=t;$('msg').classList.add('on');msgT=dur||1.6;}
function fx(r,text,color){r.fx.userData.draw(text,color,false);r.fx.visible=true;r.fxT=1.5;}
const nm=r=>`<i style="color:${hex(r.sp.color)}">${r.sp.name}</i>`;
function order(){
  return racers.slice().sort((a,b)=>{
    if(a.finish!=null&&b.finish!=null)return a.finish-b.finish;
    if(a.finish!=null)return -1;if(b.finish!=null)return 1;return b.dist-a.dist;});
}

/* ---------- items ---------- */
function itemInfo(it){
  if(it==null)return null;
  if(it==='glu')return{name:t('glu')[0],sub:t('glu')[1],col:'#fff07a'};
  if(it==='pyr')return{name:t('pyr')[0],sub:t('pyr')[1],col:'#ffc24d'};
  if(it==='bde')return{name:t('bde')[0],sub:t('bde')[1],col:'#ff6ad5'};
  if(it==='bio')return{name:t('bio')[0],sub:t('bio')[1],col:'#9dffd9'};
  if(it==='phg')return{name:t('phg')[0],sub:t('phg')[1],col:'#b0ff5a'};
  const a=ABX[it];return{name:t('paren',abxT(it,'cls'),abxT(it,'drug')),sub:abxT(it,'mech'),col:hex(a.col),abx:a,k:it};
}
function showItem(){
  const p=me(),inf=itemInfo(p.item),el=$('item');
  el.classList.toggle('empty',!inf);
  if(!inf){$('in').textContent=t('none');$('in').style.color='';$('is').textContent=t('noneSub');$('ic').innerHTML='';return;}
  $('in').textContent=inf.name;$('in').style.color=inf.col;$('is').textContent=inf.sub;
  $('ic').innerHTML=inf.abx?racers.filter(r=>r!==p).map(r=>{const e=r.sp.s[inf.k];
    return `<span class="e${e}" style="color:${hex(r.sp.color)}" title="${t('eff')[e]}">${r.sp.ab}${'×○◎'[e]}</span>`;}).join(''):'';
}
function rollItem(r){
  const o=order().filter(x=>x.finish==null),f=o.length>1?o.indexOf(r)/(o.length-1):0;
  const bo=r.sp.noGlu?'pyr':'glu';
  const w=[[bo,4-2*f],['bio',2.5-1.5*f],['phg',.4+5*f]];for(let k=0;k<5;k++)w.push([k,.65+.65*f]);
  if(r.dist>LEN*.28&&o.indexOf(r)>=2)w.push(['bde',1.6]);
  let t=Math.random()*w.reduce((a,x)=>a+x[1],0);for(const[k,x]of w){if((t-=x)<=0)return k;}return bo;
}
function giveItem(r){
  r.item=rollItem(r);r.itemT=1+Math.random()*2.5;r.tries=0;
  if(r===me()){showItem();say(t('got',itemInfo(r.item).name),1.1);}
}
function strike(tg,src,kind,k){ // returns true if it had an effect
  if(tg.finish!=null||tg.fallT>0||(tg.immT>0&&kind!=='bde'))return false;
  const p=me();
  if(tg.shieldT>0){tg.shieldT=0;fx(tg,t('bioFx'),'#9dffd9');if(tg===p)say(t('bioSay'));return false;}
  if(kind==='bde'){ // BALOs prey only on Gram-negative cells; against Gram-positives their
    // lytic enzymes still act, but there is no invasion, so the hit is partial. BIS2 leaves
    // prey incompletely lysed, so the stop is not indefinite.
    const w='Bdellovibrio',col='#ff6ad5';
    tg.taken++;src.hits++;
    if(tg.sp.gram==='＋'){tg.slowT=2.2;tg.slowM=.62;tg.slowCol=0xff6ad5;tg.immT=3.4;fx(tg,t('bdeOff'),col);
      if(tg===p){shake=.4;say(t('bdeOffSay',w,nm(src)),2.6);}else if(src===p)say(t('bdeOffHit',nm(tg)),1.8);}
    else{tg.spinT=2.3;tg.immT=4.3;fx(tg,t('bdeFx',w),col);
      if(tg===p){shake=.9;say(t('bdeMe',w,nm(src)),2.2);}
      else if(src===p)say(t('bdeHit',w,nm(tg)),1.8);}
    return true;}
  if(kind==='phg'){tg.spinT=1.7;tg.immT=3.7;tg.taken++;src.hits++;fx(tg,t('phFx'),'#b0ff5a');
    if(tg===p){shake=.6;say(t('phMe',nm(src)),1.8);}
    else if(src===p)say(t('phHit',nm(tg)));return true;}
  const a=ABX[k],e=tg.sp.s[k];
  if(e===0){fx(tg,t('resFx',a.k),'#8fa5b0');if(tg===p)say(t('resMe',nm(src),abxT(k,'cls')),1.8);return false;}
  tg.slowT=e===2?2.6:2;tg.slowM=e===2?.45:.72;tg.immT=tg.slowT+2;tg.slowCol=a.col;tg.taken++;src.hits++;
  fx(tg,a.k+' '+t('eff')[e],hex(a.col));
  if(tg===p){shake=e===2?.5:.25;say(t('abxMe',nm(src),abxT(k,'cls'),t('eff')[e]),1.8);}
  return true;
}
const inRange=(u,t)=>t!==u&&t.finish==null&&t.dist>u.dist-15&&t.dist<u.dist+60;
function useItem(r){
  const it=r.item,p=me();if(it==null)return;
  r.item=null;
  if(it==='glu'){r.boostT=2.2;r.boostM=1.5;fx(r,t('gluFx'),'#fff07a');}
  else if(it==='pyr'){r.boostT=3;r.boostM=1.8;fx(r,t('pyrFx'),'#ffc24d');}
  else if(it==='bio'){r.shieldT=7;}
  else if(it==='phg'){
    const tg=racers.filter(o=>o!==r&&o.finish==null&&o.dist>r.dist).sort((a,b)=>a.dist-b.dist)[0];
    if(!tg){if(r===p)say(t('phNone'));}
    else{const g=buildPhage();scene.add(g);phages.push({g,src:r,tg,d:r.dist+1,x:rx(r),t:0});}
  }else if(it==='bde'){
    const w='Bdellovibrio';
    const tg=order().find(x=>x.finish==null);
    if(!tg||tg===r){if(r===p)say(t('bdeNone'));}
    else{const b=buildBdello();scene.add(b.g);phages.push({g:b.g,fl:b.fl,src:r,tg,d:r.dist+1,x:rx(r),t:0,jumbo:true});
      if(tg===p)say(t('bdeWarn',w),2.6);else if(r===p)say(t('bdeFly',w,nm(tg)),2);}
  }else{
    const a=ABX[it];
    const m=new THREE.Mesh(new THREE.TorusGeometry(1,.06,6,48),new THREE.MeshBasicMaterial({color:a.col,transparent:true,opacity:.9}));
    m.rotation.x=Math.PI/2;scene.add(m);waves.push({m,r,t:0});
    let n=0,any=0;for(const o of racers)if(inRange(r,o)){any++;if(strike(o,r,'abx',it))n++;}
    if(r===p){const c=abxT(it,'cls');say(any===0?t('abxNone',c):n===0?t('abxZero',c,any):t('abxHit',c,n),1.8);}
  }
  if(r===p)showItem();
}
function aiItem(r,dt){
  if(r.item==null||(r.itemT-=dt)>0)return;
  const it=r.item;let ok=true;
  if(it==='bde')ok=true;
  else if(it==='phg')ok=racers.some(o=>o!==r&&o.finish==null&&o.dist>r.dist);
  else if(typeof it==='number')ok=racers.some(o=>inRange(r,o)&&o.sp.s[it]>0);
  else if(it==='bio')ok=r.shieldT<=0;
  if(ok||++r.tries>3)useItem(r);else r.itemT=1.5+Math.random();
}
// route choice at forks: pick the faster side for this species (with a little personality)
function aiPlan(r){
  const sp=r.sp,j=1+(r.q-.5)*.08;
  for(const f of F){
    const g=f.a-r.dist;
    if(f.t==='s'&&g>-2&&g<34){r.tl=speedOf(sp,1)*f.gain*j>speedOf(sp,0)?f.side*(EDGE-.3):-f.side*1.5;return true;}
    if(f.t==='c'&&!f.full&&g>0&&g<30){
      const mid=(f.a+f.b)/2,opts=[{l:nearest(f.cs,r.lat),v:speedOf(sp,2)*(r.m.wrap?(sp.wrapIn||WRAP_IN):1)*j}];
      if(f.l0>-HW+2){const l=(-EDGE+f.l0-.9)/2;opts.push({l,v:speedOf(sp,envAt(mid,l))});}
      if(f.l1<HW-2){const l=(EDGE+f.l1+.9)/2;opts.push({l,v:speedOf(sp,envAt(mid,l))});}
      opts.sort((a,b)=>b.v-a.v);r.tl=opts[0].l;return true;
    }
  }
  return false;
}
function aiSteer(r,dt){
  if((r.aiT-=dt)<=0){
    r.aiT=.8+Math.random()*1.4;
    if(aiPlan(r))r.aiT=.5;
    else if(r.sp.chitin&&CHI.some(k=>k.b>r.dist+1&&k.a<r.dist+50)){
      const k=CHI.find(k=>k.b>r.dist+1&&k.a<r.dist+50);r.tl=clamp(r.lat,k.l0+.5,k.l1-.5);r.aiT=.5;}
    else if(r.sp.chiStick&&CHI.some(k=>k.b>r.dist+1&&k.a<r.dist+46)){
      const k=CHI.find(k=>k.b>r.dist+1&&k.a<r.dist+46);
      const o=[k.l0-1.2,k.l1+1.2].filter(x=>Math.abs(x)<=EDGE-.2);
      if(o.length){r.tl=o.reduce((a,b)=>Math.abs(a-r.lat)<Math.abs(b-r.lat)?a:b);r.aiT=.5;}}
    else{
      const row=r.item==null&&boxRows.find(b=>b.d>r.dist+2&&b.d<r.dist+45);
      if(row)r.tl=row.lats[Math.floor(Math.random()*row.lats.length)];
      else{const g=!r.sp.noGlu&&pick.find(q=>!q.br&&q.type==='glu'&&q.cd<=0&&q.d>r.dist+3&&q.d<r.dist+22&&Math.abs(q.lat-r.lat)<3);
        r.tl=g&&Math.random()<.7?g.lat:clamp(r.lat+(Math.random()-.5)*5,-EDGE,EDGE);}
    }
  }
  // stay clear of rail-less edges and holes ahead
  const lo=openAt(r.dist+8,-1)||openAt(r.dist,-1)?-EDGE+1.3:-EDGE+.2,hi=openAt(r.dist+8,1)||openAt(r.dist,1)?EDGE-1.3:EDGE-.2;
  r.tl=clamp(r.tl,lo,hi);
  for(const h of HOLES)if(h.b>r.dist-1&&h.a<r.dist+26&&r.tl>h.l0-1.1&&r.tl<h.l1+1.1){
    const L=h.l0-1.4,Rr=h.l1+1.4,okL=L>=lo,okR=Rr<=hi;
    r.tl=okL&&okR?(Math.abs(r.lat-L)<Math.abs(r.lat-Rr)?L:Rr):okL?L:Rr;
  }
  const d=r.tl-r.lat;r.lat+=clamp(d,-5.5*dt,5.5*dt);
}
function fall(r){
  r.fallT=.8;r.v=0;r.falls++;r.boostT=0;
  if(r===me()){shake=.5;say(t('fell'),1.6);}
}
function respawn(r){
  const d0=Math.max(0,r.dist-12);let lat=0;
  for(const l of[0,-2.5,2.5,-4.5,4.5]){let ok=true;for(let k=0;k<=30;k+=3)if(holeAt(d0+k,l,1)){ok=false;break;}if(ok){lat=l;break;}}
  const c=chAt(d0,6);if(c&&lat>=c.l0&&lat<=c.l1)lat=nearest(c.cs,lat);
  Object.assign(r,{dist:d0,lat,tl:lat,v:0,br:null,blat:0,fallT:0,immT:1.5,spinT:0,slowT:0});
  r.m.g.rotation.set(0,0,0);
}

function stepRace(dt){
  clock+=dt*TS;
  const p=me();
  const lead=racers.reduce((a,r)=>r.finish==null?Math.max(a,r.dist):a,-99);
  for(const r of racers){
    const done=r.finish!=null;
    if(r.fallT>0){if((r.fallT-=dt)<=0)respawn(r);continue;}
    const steer=r===p?((keys.right?1:0)-(keys.left?1:0)):0;
    if(r.br){ // inside a shortcut
      if(r.spinT<=0)r.blat+=r===p?steer*6.5*dt:clamp(-r.blat,-2*dt,2*dt);
      r.blat=clamp(r.blat,-(SW-.5),SW-.5);
    }else{
      if(!done&&r.spinT<=0&&!r.inCh){if(r===p)r.lat+=steer*6.5*dt;else aiSteer(r,dt);}
      // narrow-channel blocks: funnel in, or stay outside the block walls
      r.inCh=false;
      const c=chAt(r.dist,6);
      if(c){const inside=r.dist>=c.a,k=inside?1:1-(c.a-r.dist)/6;
        if(r.lat>=c.l0&&r.lat<=c.l1){const t=nearest(c.cs,r.lat);r.lat=lerp(r.lat,t,inside?.35:k*.22);r.inCh=inside;if(r!==p)r.tl=t;}
        else if(r.lat<c.l0){const lim=c.l0-.9;if(r.lat>lim)r.lat=inside?lim:lerp(r.lat,lim,k*.3);}
        else{const lim=c.l1+.9;if(r.lat<lim)r.lat=inside?lim:lerp(r.lat,lim,k*.3);}
      }
      r.lat=clamp(r.lat,openAt(r.dist,-1)?-HW-1:-EDGE,openAt(r.dist,1)?HW+1:EDGE);
      if(!done&&(Math.abs(r.lat)>HW+.25||holeAt(r.dist,r.lat))){fall(r);continue;}
      // peel off into a shortcut
      for(const s of SCS)if(r.dist>s.a&&r.dist<s.a+14&&!s.split(r.dist)&&r.lat*s.side>=s.rel(r.dist)-SW+.4&&r.lat*s.side>HW-2.6){
        r.br=s;r.blat=clamp(cx(r.dist)+r.lat-s.xs(r.dist),-(SW-.5),SW-.5);
        if(r===p)say(t('scIn',s.gain.toFixed(2)),1.6);break;}
    }
    if(r===p){if(usePressed&&!done&&r.spinT<=0)useItem(r);}else if(!done)aiItem(r,dt);
    for(const k of['boostT','slowT','spinT','shieldT','immT'])if(r[k]>0)r[k]-=dt;
    const e=renv(r);
    let mult=(r.boostT>0?r.boostM:1)*(r.slowT>0?r.slowM:1)*(r.spinT>0?.12:1);
    if(r!==p)mult*=1+.04*Math.sin(clock/TS*r.fq+r.ph);
    if(r.m.wrap){
      if(r!==p)r.wrapOn=e===2;
      else if(wrapPressed&&!done){r.wrapOn=!r.wrapOn;fx(r,t(r.wrapOn?'wrapOn':'wrapOff'),'#ffffff');}
      r.wrapK=clamp(r.wrapK+(r.wrapOn?1:-1)*2.5*dt,0,1);
      mult*=lerp(1,e===2?(r.sp.wrapIn||WRAP_IN):WRAP_OUT,r.wrapK);
    }
    const chi=!r.br&&!done&&chitinAt(r.dist,r.lat),dig=r.sp.chitin;
    if(dig||r.sp.chiStick){
      r.chiT=clamp(r.chiT+(chi?dt/(dig?1.2:.5):-dt/(dig?2.5:1.1)),0,1);
      mult*=lerp(1,dig?1.8:.6,r.chiT);
      if(chi&&!r.chiOn){r.chiOn=true;fx(r,t(dig?'chiFx':'chiStickFx'),dig?'#eaf4ef':'#9fd0ff');
        if(r===p&&!chiMsg){chiMsg=true;say(t(dig?'chiSay':'chiStickSay'),2.4);}}
      else if(!chi)r.chiOn=false;
    }else if(chi&&r===p&&!chiMsg){chiMsg=true;say(t('chiNo'),2.2);}
    if(battle)mult*=1+Math.min(.12,Math.max(0,lead-r.dist)/500);
    if(mult>MAXM)mult=MAXM;
    if(done)mult=r.dist<LEN+6+r.i?.5:0;
    r.v+=(speedOf(r.sp,e)*mult-r.v)*Math.min(1,dt*5);
    const nd=r.dist+r.v*dt*TS*(r.br?r.br.gain:1);
    if(!done&&nd>=LEN){r.finish=clock-(nd-LEN)/Math.max(r.v,.01);
      if(firstFin==null){firstFin=clock;endAt=DEADLINE;if(r!==p)say(t('goal',nm(r)));}}
    r.dist=nd;
    if(r.br&&r.dist>=r.br.b){r.lat=clamp(r.br.xs(r.br.b)+r.blat-cx(r.br.b),-EDGE,EDGE);r.tl=r.lat;r.br=null;}
  }
  usePressed=false;wrapPressed=false;
  // soft bumping on the open road (can shove a rival off a rail-less edge)
  for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){const a=racers[i],b=racers[j];
    if(a.finish!=null||b.finish!=null||a.br||b.br||a.inCh||b.inCh||a.fallT>0||b.fallT>0)continue;
    const dd=Math.abs(a.dist-b.dist),dl=a.lat-b.lat;
    if(dd<2.4&&Math.abs(dl)<1){const push=(1-Math.abs(dl))*4*dt*(dl>=0?1:-1);a.lat+=push;b.lat-=push;}
  }
  // pickups
  for(const q of pick){
    if(q.cd>0){if((q.cd-=dt)<=0)q.m.visible=true;continue;}
    for(const r of racers){
      if(r.finish!=null||r.fallT>0||r.br!==q.br||Math.abs(r.dist-q.d)>1.4||Math.abs((r.br?r.blat:r.lat)-q.lat)>1)continue;
      if(q.type==='glu'){if(r.sp.noGlu){if(r===me()&&!gluMsg){gluMsg=true;fx(r,t('noGlu'),'#8fa5b0');say(t('gluNo'),2);}continue;}if(r.boostT<=0)r.boostM=1.5;r.boostT=Math.max(r.boostT,.9);q.cd=5;q.m.visible=false;break;}
      if(r.item==null){giveItem(r);q.cd=3;q.m.visible=false;break;}
    }
  }
  // phages in flight
  for(const f of phages){
    f.t+=dt;const tg=f.tg;
    f.d+=(f.jumbo?predSpeed():Math.max(tg.v,10)+70)*dt*TS;f.x=lerp(f.x,rx(tg),f.jumbo?.2:.14);
    if(tg.finish!=null||f.t>(f.jumbo?45:12))f.dead=true;
    else if(f.d>=tg.dist-.6){f.dead=true;strike(tg,f.src,f.jumbo?'bde':'phg');}
    if(f.dead)scene.remove(f.g);
  }
  phages=phages.filter(f=>!f.dead);
  const key=renv(p)+(p.br?10:0);if(key!==lastEnv){setEnvBanner(renv(p),true);lastEnv=key;}
  if(endAt!=null)endAt-=dt;
  if(p.finish!=null&&(endAt==null||endAt>1.4))endAt=1.4;
  if(endAt!=null&&endAt<=0)finish();
}

function finish(){
  state='done';
  const o=order(),p=me(),rank=o.indexOf(p)+1;
  const theo=SPECIES.map(s=>{let t=0;for(let d=0;d<LEN;d+=2)t+=2/speedOf(s,envAt(d,0));return{s,t};}).sort((a,b)=>a.t-b.t);
  $('rc').textContent=t('rc',coT(course,'name'),LEN,moT(modeIdx,'name'));
  $('rh').textContent=rank===1?t('win'):t('place',rank);
  const myTheo=theo.findIndex(x=>x.s===p.sp)+1;
  $('rs').innerHTML=(p.finish!=null?t('time',p.finish.toFixed(2)):t('timeout',Math.max(0,p.dist).toFixed(1)))
    +t('theo',`<i style="color:${hex(theo[0].s.color)}">${theo[0].s.name}</i>`,`<i>${p.sp.name}</i>`,myTheo)
    +(rank<myTheo?t('up'):rank>myTheo?t('down'):'');
  $('rt').innerHTML=o.map((r,i)=>`<tr class="${r===p?'me':''}"><td>${i+1}</td><td><span class="nm" style="color:${hex(r.sp.color)}">${r.sp.name}</span>${r===p?'<span class="you">YOU</span>':''}</td><td class="h num">${t('stats',r.hits,r.taken,r.falls)}</td><td class="num">${
    r.finish!=null?r.finish.toFixed(2)+' s':clamp(r.dist,0,LEN).toFixed(1)+' µm'}</td></tr>`).join('');
  $('result').classList.remove('hidden');
}

/* ================= frame ================= */
const look=new THREE.Vector3();let last=performance.now(),tAll=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;tAll+=dt;
  if(state==='menu'){
    if(preview){spinModel(preview,14,dt);preview.g.rotation.y+=dt*.25;preview.g.position.y=PVY+Math.sin(tAll*.8)*.15;}
    const narrow=window.innerWidth<1000,ox=narrow?0:-3.4;
    camera.position.set(ox,PVY+1.6,7.5);look.set(ox,PVY,0);camera.lookAt(look);
    scene.fog.density=.004;scene.background.set(0x050d16);scene.fog.color.set(0x050d16);
    renderer.render(scene,camera);return;
  }
  if(state==='count'){
    count-=dt;$('center').textContent=count>.2?Math.ceil(count-.2):'GO!';
    if(count<=0)state='race';
  }else if($('center').textContent){ if((count-=dt)<-.7)$('center').textContent=''; }
  if(state==='race')stepRace(dt);
  if(msgT>0&&(msgT-=dt)<=0)$('msg').classList.remove('on');

  const p=me(),o=order(),moving=state!=='count';
  for(const r of racers){
    const g=r.m.g,x=rx(r),z=-r.dist;
    const y=r.fallT>0?-(.8-r.fallT)*9:Math.sin(tAll*2+r.ph)*.06;
    g.position.set(x,y,z);
    spinModel(r.m,moving?6+r.v*.8:5,dt);
    if(r.m.sprb)updSprB(r.m,moving&&r.fallT<=0?r.v:0,dt);
    const head=-Math.atan(r.br?r.br.slope:dcx(r.dist));
    if(r.fallT>0){g.rotation.x-=dt*5;}
    else if(r.spinT>0){g.rotation.y+=dt*16;g.rotation.x=Math.sin(tAll*30)*.5;}
    else{const steer=r===p?((keys.right?1:0)-(keys.left?1:0)):clamp(r.tl-r.lat,-1,1);
      g.rotation.y=lerp(g.rotation.y%(Math.PI*2),head-steer*.22,.2);g.rotation.x=0;
      g.rotation.z=r.m.sprb?g.rotation.z+sprbV(r.v)*dt*TS*r.m.rollK:Math.sin(tAll*9+r.ph)*.07*Math.min(1,r.v/10);}
    if(r.m.wrap)for(const w of r.m.wrap){const k=r.wrapK*r.wrapK*(3-2*r.wrapK),xy=lerp(1,2.1,k);w.scale.set(xy,xy,lerp(1,-.62,k));}
    r.m.shield.visible=r.shieldT>0;
    if(r.slowT>0)r.m.body.emissive.set(r.slowCol).multiplyScalar(.5+.4*Math.sin(tAll*14));
    else if(r.boostT>0)r.m.body.emissive.set(0xfff07a).multiplyScalar(.7);
    else if(r.chiT>.05)r.m.body.emissive.set(r.sp.chitin?0xdff0ea:0x5f9fd8).multiplyScalar(.25+.5*r.chiT);
    else r.m.body.emissive.copy(r.m.base);
    r.lb.position.set(x,1.5+y,z);r.lb.visible=r!==p;
    if(r.fxT>0){r.fxT-=dt;r.fx.position.set(x,2.3+(1.5-r.fxT)*.5,z);if(r.fxT<=0)r.fx.visible=false;}
  }
  const px=rx(p);
  youTag.position.set(px,1.5,-p.dist);youTag.visible=p.fallT<=0;
  glow.position.set(px,1.5,-p.dist+1);glow.color.set(p.sp.color);
  for(const q of pick){if(q.type==='box'){q.m.rotation.x+=dt*1.2;q.m.rotation.y+=dt*1.7;}else{q.m.rotation.y+=dt*2.2;q.m.position.y=Math.sin(tAll*3+q.d)*.1;}}
  for(const f of phages){f.g.position.set(f.x,.5+Math.sin(tAll*12)*.1,-f.d);
    if(f.fl){f.fl.rotation.z-=dt*34;f.g.rotation.z=Math.sin(tAll*16)*.12;}else{f.g.rotation.y+=dt*6;f.g.rotation.x=-.5;}}
  for(const w of waves){w.t+=dt;const s=1+w.t*52;w.m.scale.set(s,s,1);w.m.position.set(rx(w.r),.1,-w.r.dist);w.m.material.opacity=Math.max(0,.9-w.t*1.1);
    if(w.t>.85){scene.remove(w.m);w.dead=true;}}
  waves=waves.filter(w=>!w.dead);

  // mood: thicker haze inside viscous areas
  curFog=lerp(curFog,TH.fog*(renv(p)===1?1.7:1),.05);scene.fog.density=curFog;
  scene.background.set(TH.bg);scene.fog.color.set(TH.bg);

  // chase camera follows whichever path the player is on
  const sh=shake>0?(shake-=dt,(Math.random()-.5)*shake*.8):0;
  const path=d=>p.br?p.br.xs(d)+p.blat*.8:cx(d)+p.lat*.8;
  const cd=p.dist-7.5,ld=p.dist+10;
  camX=lerp(camX,path(cd),.18);lookX=lerp(lookX,p.br?p.br.xs(ld)+p.blat*.45:cx(ld)+p.lat*.45,.18);
  camera.position.set(camX+sh,3.5+sh,-cd);
  const fov=p.boostT>0?72:62;if(Math.abs(camera.fov-fov)>.1){camera.fov=lerp(camera.fov,fov,.1);camera.updateProjectionMatrix();}
  look.set(lookX,.2,-ld);camera.lookAt(look);

  // HUD
  if(p.m.wrap){const in3=renv(p)===2,el=$('wrap');
    el.classList.toggle('on',p.wrapOn);el.classList.toggle('warn',p.wrapOn!==in3);
    $('wk').textContent=t(p.wrapOn?'wrapOn':'wrapOff');
    $('wh').textContent=p.wrapOn?(in3?t('wIn',p.sp.wrapIn||WRAP_IN):t('wOut',WRAP_OUT)):t(in3?'wOffIn':'wOff');}
  $('rk').textContent=o.indexOf(p)+1;
  $('tm').textContent=(p.finish!=null?p.finish:clock).toFixed(2);
  $('sv').textContent=p.v.toFixed(1);
  for(const r of racers){const d=$('d'+r.i);if(d)d.style.left=clamp(r.dist/LEN*100,0,100)+'%';}
  if(state==='race'&&firstFin!=null&&p.finish==null&&endAt!=null&&msgT<=0){$('msg').textContent=t('timeup',Math.ceil(endAt));$('msg').classList.add('on');}
  renderer.render(scene,camera);
}
renderMenu();refreshMenu();
requestAnimationFrame(frame);
})();
</script>
